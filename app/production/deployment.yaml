apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin-app
  labels:
    app: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - h89-1
                      - h89-2
      containers:
        - name: jellyfin
          image: linuxserver/jellyfin@sha256:82c8c6785fece0ce9470e5541f3d0b68afd104f1857c91c3f55c369843394658
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: JELLYFIN_PublishedServerUrl
              value: https://media.glauciolabs.work
          ports:
            - containerPort: 8096
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 800m
              memory: 1Gi
            requests:
              cpu: 150m
              memory: 256Mi
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media
              name: media-public
              mountPropagation: HostToContainer
              readOnly: true
        - name: rclone
          image: rclone/rclone:latest
          args:
            - mount
            - "gdrive:media"
            - /media
            - --config=/config/rclone/rclone.conf
            - --allow-other
            - --allow-non-empty
            - --vfs-cache-mode=full
            - --vfs-cache-max-size=10G
            - --cache-dir=/tmp/rclone-cache
            - --vfs-read-chunk-size=32M
            - --vfs-read-chunk-size-limit=off
            - --buffer-size=64M
            - --dir-cache-time=12h
            - --read-only
            - --uid=1000
            - --gid=1000
          lifecycle:
            preStop:
              exec:
                command: ["fusermount", "-uz", "/media"]
          securityContext:
            privileged: true
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /media
              name: media-public
              mountPropagation: Bidirectional
            - mountPath: /config/rclone
              name: rclone-config
              readOnly: true
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          hostPath:
            path: /data/jellyfin-app/config
            type: DirectoryOrCreate
        - name: media-public
          emptyDir: {}
        - name: rclone-config
          secret:
            secretName: rclone-config
