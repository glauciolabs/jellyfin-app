apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: jellyfin-prod
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    #external-dns.alpha.kubernetes.io/target: "ddb0b78f-c9e7-43f8-887a-acf61e79133c.cfargotunnel.com"
    external-dns.alpha.kubernetes.io/target: 146.235.33.238,163.176.220.147,136.248.74.107
spec:
  virtualhost:
    fqdn: media.glauciolabs.work
    tls:
      secretName: media-tls-prod
  routes:
  - conditions:
    - prefix: /
    services:
    - name: jellyfin
      port: 8096
    loadBalancerPolicy:
      strategy: Cookie
    timeoutPolicy:
      response: infinity
      idle: infinity